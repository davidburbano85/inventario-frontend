<!-- ==========================================================
     Ubicación:
     src/app/features/autenticacion/paginas/login/login.component.html

     Se utilizan únicamente las clases globales del proyecto.
     No se agregan estilos inline ni clases inventadas.
=========================================================== -->

<div class="layout-publico">

    <div class="layout-publico-contenedor contenedor">

        <!-- Panel informativo -->
        <section class="layout-publico-panel">

            <div class="layout-publico-logo">

                <!-- Reemplazar por el logo oficial -->
                <h1>Inventario</h1>

            </div>

            <div class="layout-publico-contenido">

                <span class="badge badge-primario">

                    Sistema de Inventario

                </span>

                <h2 class="layout-publico-titulo">

                    Bienvenido

                </h2>

                <p class="layout-publico-texto">

                    Inicie sesión para acceder al sistema de inventario y
                    administrar la información de forma segura.

                </p>

            </div>

        </section>



        <!-- Panel formulario -->
        <section class="layout-publico-formulario">

            <div class="layout-publico-caja">

                <div class="tarjeta tarjeta-elevada">

                    <div class="tarjeta-encabezado">

                        <div>

                            <h2 class="tarjeta-titulo">

                                Iniciar sesión

                            </h2>

                            <p class="tarjeta-subtitulo">

                                Ingrese sus credenciales para continuar.

                            </p>

                        </div>

                    </div>


                    <div class="tarjeta-contenido">

                        <!-- Mensajes -->
                        <app-alerta />

                        <!--
                            El formulario obtiene toda su configuración
                            desde FormularioService.
                        -->
                        <app-formulario
                            textoBoton="Ingresar"
                            claseBoton="btn btn-primario btn-bloque"
                            (guardar)="iniciarSesion($event)">
                        </app-formulario>

                    </div>

                </div>

            </div>

        </section>

    </div>

    <!-- Spinner global -->
    <app-spinner />

</div>
