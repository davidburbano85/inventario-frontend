<!-- src/app/compartido/componentes/spinner/spinner.component.html -->

@if (visible()) {

<div class="spinner-fondo">

    <div
        class="spinner"
        role="status"
        aria-live="polite"
        aria-label="Cargando">

        <div class="spinner-circulo"></div>

        <span class="spinner-texto">

            Cargando...

        </span>

    </div>

</div>

}
